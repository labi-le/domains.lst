mode: rule
allow-lan: true
bind-address: "*"
# debug is 96% per-connection TLS fingerprint and REALITY chatter, which drowns the
# routing decisions in the 64 KiB ring buffer. info keeps every match RuleSet line.
log-level: info
ipv6: false
tproxy-port: 12342

iptables:
  inbound-interface: br-lan

proxies:
  - name: WARP-AWG1
    type: direct
    udp: true
    interface-name: awg1

  - name: WARP-AWG0
    type: direct
    udp: true
    interface-name: awg0

  # Cloudflare WARP through a Finland relay: the only rung platform.claude.com answers 200
  # for, against 403 over awg0 and awg1, so it backs the subscription not the WARP group.
  - name: WARP-AWG2
    type: direct
    udp: true
    interface-name: awg2

dns:
  enable: true
  listen: 0.0.0.0:12344
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.1.0/24
  store-fake-ip: true
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - RULE-SET,vpn,fake-ip
    - RULE-SET,telegram,fake-ip
    - RULE-SET,warp,fake-ip
    - MATCH,real-ip
  nameserver:
    - 127.0.0.1:5453

proxy-providers:
  # Pre-filtered raw URI list served by sub-preprocessor (https://github.com/labi-le/sub-preprocessor)
  stable:
    type: http
    url: "http://192.168.1.2:7008/stable.txt"
    path: ./providers/stable.yaml
    interval: 3600
    health-check:
      enable: true
      url: "http://cp.cloudflare.com/generate_204"
      interval: 60
      timeout: 1000
      lazy: false
      expected-status: 204

proxy-groups:
  - name: WARP
    type: fallback
    proxies:
      - WARP-AWG0
      - WARP-AWG1
      # Last rung: with both tunnels dead the traffic meets the ISP block itself instead of
      # hanging on a tunnel that carries nothing.
      - DIRECT
    # Cloudflare is the one destination WARP still reaches when its egress is broken, so a
    # cp.cloudflare.com probe reports healthy while nothing else passes. Probe off-net.
    url: "http://captive.apple.com/"
    interval: 300
    # A frozen verdict here egresses raw, and the default `lazy: true` stops re-probing one
    # interval after the last dial, so a startup probe taken before awg0/awg1 handshake
    # would pin the DIRECT rung until traffic arrives to unstick it.
    lazy: false
    # awg0 answers this probe in 5.9-7.3s, once not at all inside 10s, while carrying
    # Telegram at 0.07s, so anything near the implicit 5000ms retires the healthier rung.
    # Fallback ignores `tolerance`, and `max-failed-times` never fires for direct members.
    timeout: 12000
    expected-status: 200

  - name: VPN
    type: fallback
    proxies:
      - VPN-ALL-AUTO
      - WARP-AWG2
    url: "https://platform.claude.com/"
    interval: 60
    # Rung 1 is only demoted by a probe, and `lazy` would skip probes while `vpn` is idle,
    # leaving a stale verdict no traffic can correct.
    lazy: false
    # "Subscription failed" here means no node answers 2xx/3xx from one vendor, so an
    # Anthropic-side block on the provider's ranges moves every vpn domain onto awg2.
    expected-status: 200-399

  - name: VPN-ALL-AUTO
    type: url-test
    use:
      - stable
    url: "https://platform.claude.com/"
    interval: 60
    timeout: 1000
    tolerance: 150
    lazy: false
    expected-status: 200-399
    max-failed-times: 1
    # An empty `stable` provider must not degrade to COMPATIBLE, a plain direct outbound with
    # no interface bind, which would egress vpn domains straight to the WAN. REJECT keeps the
    # killswitch for the case where WARP-AWG2 is dead too.
    empty-fallback: REJECT

rule-providers:
  vpn:
    type: file
    path: ./rules/vpn.txt
    behavior: domain
    format: text

  warp:
    type: file
    path: ./rules/warp.txt
    behavior: domain
    format: text

  warp_ip:
    type: file
    path: ./rules/warp_ip.txt
    behavior: ipcidr
    format: text

  telegram:
    type: file
    path: ./rules/telegram.txt
    behavior: domain
    format: text

  telegram_ip:
    type: file
    path: ./rules/telegram_ip.txt
    behavior: ipcidr
    format: text

rules:
  - RULE-SET,vpn,VPN
  - RULE-SET,telegram,WARP
  - RULE-SET,telegram_ip,WARP,no-resolve
  - RULE-SET,warp,WARP
  - RULE-SET,warp_ip,WARP,no-resolve
  - MATCH,DIRECT
